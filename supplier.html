<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Supplier</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="menu-button">
        <button id="menuToggle">
            <i class="fas fa-bars"></i> Menu
        </button>
        <div class="dropdown-menu" id="dropdownMenu">
            <a href="index.html">
                <i class="fas fa-boxes"></i> Master Barang
            </a>
            <a href="supplier.html" class="active">
                <i class="fas fa-truck"></i> Master Supplier
            </a>
            <a href="transaksi.html">
                <i class="fas fa-exchange-alt"></i> Transaksi
            </a>
            <a href="kartu-hutang.html">
                <i class="fas fa-file-invoice-dollar"></i> Kartu Hutang
            </a>
            <a href="rekap-hutang.html">
                <i class="fas fa-chart-pie"></i> Rekap Hutang
            </a>
            <a href="analytic.html">
                <i class="fas fa-chart-bar"></i> Statistik Barang
            </a>
        </div>
    </div>

    <div class="container">
        <header>
            <h1><i class="fas fa-truck"></i> Master Supplier</h1>
        </header>
        
        <div class="form-container">
            <div class="form-row">
                <div class="form-group">
                    <label for="kodeSupplier">Kode Supplier</label>
                    <input type="text" id="kodeSupplier" placeholder="Masukkan kode supplier">
                </div>
                <div class="form-group">
                    <label for="namaSupplier">Nama Supplier</label>
                    <input type="text" id="namaSupplier" placeholder="Masukkan nama supplier">
                </div>
                <div class="form-group">
                    <label for="telepon">Telepon</label>
                    <input type="text" id="telepon" placeholder="Masukkan nomor telepon">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="alamat">Alamat</label>
                    <input type="text" id="alamat" placeholder="Masukkan alamat lengkap">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Masukkan email">
                </div>
                <div class="form-group">
                    <label for="saldoAwal">Saldo Awal Hutang</label>
                    <input type="text" id="saldoAwal" placeholder="Masukkan saldo awal" class="number-input">
                </div>
            </div>
            
            <div class="btn-container">
                <div class="btn-group-left">
                    <button class="btn btn-tambah" id="btnTambahSupplier">
                        <i class="fas fa-plus"></i> Tambah Supplier
                    </button>
                    <button class="btn btn-simpan" id="btnSimpanSupplier" disabled>
                        <i class="fas fa-save"></i> Simpan
                    </button>
                </div>
                <div class="btn-group-right">
                    <button class="btn btn-edit" id="btnEditSupplier" disabled>
                        <i class="fas fa-edit"></i> Edit
                    </button>
                    <button class="btn btn-hapus" id="btnHapusSupplier" disabled>
                        <i class="fas fa-trash"></i> Hapus
                    </button>
                </div>
            </div>
            
            <div id="statusMessage" class="status-message"></div>
        </div>
        
        <div class="table-container">
            <table id="tableSupplier">
                <thead>
                    <tr>
                        <th>Kode Supplier</th>
                        <th>Nama Supplier</th>
                        <th>Telepon</th>
                        <th>Alamat</th>
                        <th>Email</th>
                        <th>Saldo Awal</th>
                        <th>Total Hutang</th>
                    </tr>
                </thead>
                <tbody id="tableSupplierBody"></tbody>
            </table>
        </div>
    </div>
    
    <div class="modal" id="deleteModalSupplier">
        <div class="modal-content">
            <h3><i class="fas fa-exclamation-triangle"></i> Konfirmasi Hapus</h3>
            <p>Apakah Anda yakin ingin menghapus supplier ini?</p>
            <div class="modal-buttons">
                <button class="btn btn-cancel" id="btnCancelDeleteSupplier">
                    <i class="fas fa-times"></i> Batal
                </button>
                <button class="btn btn-confirm" id="btnConfirmDeleteSupplier">
                    <i class="fas fa-check"></i> Hapus
                </button>
            </div>
        </div>
    </div>

    <script src="menu.js"></script>
    <script src="supplier.js"></script>
</body>
</html>
